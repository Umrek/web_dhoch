[project]
name = "oderske-chasy-web"
version = "0.1.0"
description = "Web Dechové hudby Oderské chasy: veřejná prezentace a privátní portál pro muzikanty."
readme = "README.md"
# Authoritative runtime: Python 3.12 everywhere (local, CI, Docker, staging, production).
requires-python = "==3.12.*"
dependencies = [
    "Django==5.2.17",
    "django-axes==8.3.1",
    "django-csp==4.0",
    "whitenoise==6.12.0",
    "psycopg[binary]==3.3.6",
    "gunicorn==26.2.0",
    # Exact version is fixed by uv.lock. Range kept because the version could not be
    # verified offline when this file was authored.
    "Pillow>=11.3.0,<13",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "pytest-playwright>=0.7.2,<1",
    "ruff==0.16.10",
    "mypy>=1.19,<3",
    "django-stubs>=5.2.9,<6",
    "djlint==1.46.4",
    "pre-commit>=4.5.1,<5",
    "pip-audit==2.10.1",
    "bandit==1.9.4",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003", "DJ001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "-m", "not e2e",
    "--cov=src/apps",
    "--cov=src/config",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = ["e2e: browser end-to-end tests (need Playwright browsers; run with -m e2e)"]

[tool.coverage.run]
omit = ["*/migrations/*", "src/manage.py", "src/config/asgi.py", "src/config/wsgi.py"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/", "^tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.djlint]
profile = "django"
indent = 2
ignore = "H006,H021,H030,H031,T002"
max_line_length = 120
