name: Update uv.lock

# Manually triggered. Resolves dependencies in a trusted GitHub-hosted runner and opens a pull request.
# A lock file is never produced on developer machines behind TLS-inspecting proxies.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Resolve and lock (uses PyPI hashes)
        run: uv lock
      - name: Verify lock consistency
        run: uv lock --check
      - name: Verify the lock installs on Python 3.12
        run: |
          uv sync --frozen
          uv run python -c "import sys, django; assert sys.version_info[:2] == (3, 12); assert django.VERSION[:2] == (5, 2); print(sys.version, django.get_version())"
      - name: Dependency summary (for review)
        run: uv tree --frozen --depth 1 >> "$GITHUB_STEP_SUMMARY"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-uv-lock
          delete-branch: true
          commit-message: "chore: update uv.lock"
          title: "chore: update uv.lock"
          body: |
            Generated by the manually triggered `Update uv.lock` workflow with `uv lock` on Python 3.12.
            Review the dependency diff, then merge.
            Pull requests created with `GITHUB_TOKEN` do not start other workflows. To validate:
            Actions → CI → Run workflow → branch `chore/update-uv-lock` (and the same for "Security scans").
          add-paths: |
            uv.lock
